<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Card</title>
<link rel="stylesheet" href="style.css?v=14">
</head>
<body>

<div class="bg-stack" id="bgStack"></div>
<div class="bg-stack bg-blur-wrap"><div class="bg-blur"></div></div>

<div class="page">
  <header>
    <div class="scroll-hint">Scroll Down <span class="arr">&#8595;</span></div>
  </header>

  <section class="stage" id="stage" aria-label="Galeri kartu geser">
    <div class="track" id="track"></div>
  </section>

  <div class="controls">
    <button class="arrow" id="prev" aria-label="Sebelumnya">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button class="arrow" id="next" aria-label="Berikutnya">&#8594;</button>
  </div>
  <div class="counter" id="counter">01 / 05</div>

  <section class="explain">
    <div class="explain-inner">
      <div id="explainBox"></div>
    </div>
  </section>
</div>

<div class="lightbox" id="lightbox">
  <button class="lb-close" id="lbClose" aria-label="Tutup">&#10005;</button>
  <div class="lb-card">
    <div class="lb-card-in" id="lbCardIn">
      <img id="lbColorImg" alt="Versi warna">
      <div class="lb-scratch-hint" id="lbHint">Coret untuk mewarnai</div>
    </div>
  </div>
  <button class="lb-reset" id="lbReset" aria-label="Ulangi coretan">&#8635;</button>
</div>

<script src="script.js?v=17"></script>
</body>
</html>
